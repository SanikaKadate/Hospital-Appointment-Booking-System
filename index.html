<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MedFlow | Fixed Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.85), rgba(0, 242, 254, 0.85)), url('https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&q=80&w=2000');
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        .hidden {
            display: none !important;
        }

        .navbar {
            background: rgba(0,0,0,0.25);
            backdrop-filter: blur(15px);
        }

        .btn-dash {
            transition: 0.3s;
            height: 100%;
            border: none;
            color: white;
            border-radius: 15px;
        }

            .btn-dash:hover {
                transform: translateY(-8px);
                filter: brightness(1.1);
                color: white;
            }

        .stat-card {
            padding: 20px;
            text-align: center;
            background: white;
            border-radius: 15px;
        }

        .stat-val {
            font-size: 2rem;
            font-weight: 800;
            display: block;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark px-4 py-2">
        <span class="navbar-brand fw-bold"><i class="fas fa-hand-holding-medical me-2"></i>MedFlow Portal</span>
        <span id="userBadge" class="badge bg-light text-dark hidden"></span>
    </nav>

    <div id="loginPage" class="container mt-5 animate__animated animate__fadeIn">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-lg p-4 mt-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary d-inline-block p-3 rounded-circle text-white mb-3 shadow">
                            <i class="fas fa-user-md fa-3x"></i>
                        </div>
                        <h3 class="text-primary fw-bold">Portal Login</h3>
                    </div>
                    <input id="email" class="form-control my-2 py-2" placeholder="Email">
                    <input id="password" type="password" class="form-control my-2 py-2" placeholder="Password">
                    <button onclick="login()" class="btn btn-primary w-100 mt-3 py-2">Login</button>
                    <p id="error" class="text-danger text-center mt-2 small fw-bold"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="patientDashboard" class="container mt-5 hidden animate__animated animate__fadeIn">
        <div class="text-center mb-5">
            <h1 class="text-white fw-bold">Welcome, <span class="user-name-display"></span></h1>
            <p class="text-white-50">Manage your appointments and medical records</p>
        </div>
        <div class="row justify-content-center g-4">
            <div class="col-md-3">
                <button onclick="showBooking()" class="btn btn-success btn-dash w-100 py-5">
                    <i class="fas fa-calendar-check fa-3x mb-3"></i>
                    <h4>New Appointment</h4>
                </button>
            </div>
            <div class="col-md-3">
                <button onclick="showAppointments()" class="btn btn-info btn-dash w-100 py-5">
                    <i class="fas fa-file-medical fa-3x mb-3"></i>
                    <h4>My Health Records</h4>
                </button>
            </div>
            <div class="col-md-3">
                <button onclick="logout()" class="btn btn-danger btn-dash w-100 py-5">
                    <i class="fas fa-sign-out-alt fa-3x mb-3"></i>
                    <h4>Logout</h4>
                </button>
            </div>
        </div>
    </div>

    <div id="doctorDashboard" class="container mt-5 hidden animate__animated animate__fadeIn">
        <div class="text-center mb-5">
            <h1 class="text-white fw-bold">Welcome, <span class="user-name-display"></span></h1>
            <p class="text-white-50">Medical Administrator Control Panel</p>
        </div>
        <div class="row justify-content-center g-4">
            <div class="col-md-3">
                <button onclick="showAppointments()" class="btn btn-primary btn-dash w-100 py-5">
                    <i class="fas fa-user-clock fa-3x mb-3"></i>
                    <h4>Today's Patients</h4>
                </button>
            </div>
            <div class="col-md-3">
                <button onclick="showStats()" class="btn btn-warning btn-dash w-100 py-5">
                    <i class="fas fa-chart-pie fa-3x mb-3"></i>
                    <h4>Clinic Analytics</h4>
                </button>
            </div>
            <div class="col-md-3">
                <button onclick="logout()" class="btn btn-danger btn-dash w-100 py-5">
                    <i class="fas fa-sign-out-alt fa-3x mb-3"></i>
                    <h4>Logout</h4>
                </button>
            </div>
        </div>
    </div>

    <div id="bookingPage" class="container mt-5 hidden">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow animate__animated animate__zoomIn">
                    <h3 class="text-center text-primary fw-bold mb-4">Book New Visit</h3>
                    <label class="small fw-bold text-secondary">PATIENT NAME</label>
                    <input type="text" id="pname" class="form-control mb-3" placeholder="Enter Patient Name">
                    <label class="small fw-bold text-secondary">SELECT SPECIALIST</label>
                    <select id="doctor" class="form-select mb-3">
                        <option>Dr. Sharma</option>
                        <option>Dr. Patel</option>
                    </select>
                    <label class="small fw-bold text-secondary">SELECT DATE</label>
                    <input type="date" id="date" class="form-control mb-3">
                    <label class="small fw-bold text-secondary">PREFERED TIME</label>
                    <input type="time" id="time" class="form-control mb-3">
                    <button onclick="book()" class="btn btn-primary w-100 py-2">Confirm Slot</button>
                    <p id="msg" class="text-center mt-3 fw-bold"></p>
                    <button onclick="backDashboard()" class="btn btn-outline-secondary w-100 mt-2">Back</button>
                </div>
            </div>
        </div>
    </div>

    <div id="appointmentsPage" class="container mt-5 hidden">
        <div class="card p-4 animate__animated animate__fadeInUp">
            <h3 id="apptTitle" class="text-primary fw-bold mb-4">Schedule</h3>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="data"></tbody>
                </table>
            </div>
            <button onclick="backDashboard()" class="btn btn-secondary mt-3">Back to Dashboard</button>
        </div>
    </div>

    <div id="statsPage" class="container mt-5 hidden">
        <div class="card p-4">
            <h3 class="text-primary fw-bold mb-4">Practice Overview</h3>
            <div class="row g-3">
                <div class="col-md-4"><div class="stat-card border-top border-primary border-4"><span id="totalCount" class="stat-val text-primary">0</span>Total Appointments</div></div>
                <div class="col-md-4"><div class="stat-card border-top border-warning border-4"><span id="pendingCount" class="stat-val text-warning">0</span>Pending Visits</div></div>
                <div class="col-md-4"><div class="stat-card border-top border-danger border-4"><span id="cancelledCount" class="stat-val text-danger">0</span>Cancelled</div></div>
            </div>
            <button onclick="backDashboard()" class="btn btn-secondary mt-4">Return</button>
        </div>
    </div>

    <script>
        let currentUser = null;

        function login() {
            const email = document.getElementById("email").value;
            const pass = document.getElementById("password").value;

            if (pass === "MedFlow1234") {
                if (email === "doctor@med.com") {
                    // ADDED: name property
                    currentUser = {role: "doctor" };
                } else if (email === "patient@med.com") {
                    // ADDED: name property
                    currentUser = {role: "patient" };
                } else {
                    document.getElementById("error").innerText = "Account not recognized.";
                    return;
                }
                setupUI();
            } else {
                document.getElementById("error").innerText = "Invalid Credentials.";
            }
        }

        function setupUI() {
            document.getElementById("loginPage").classList.add("hidden");
            if (currentUser.role === 'doctor') {
                document.getElementById("doctorDashboard").classList.remove("hidden");
                document.getElementById("apptTitle").innerText = "Master Clinic Schedule";
            } else {
                document.getElementById("patientDashboard").classList.remove("hidden");
                document.getElementById("apptTitle").innerText = "My Medical Visits";
            }

            // This now works because currentUser.name exists
            document.querySelectorAll(".user-name-display").forEach(el => el.innerText = currentUser.name);

            const badge = document.getElementById("userBadge");
            badge.innerText = currentUser.role.toUpperCase();
            badge.classList.remove("hidden");
        }

        function book() {
            const doctorVal = document.getElementById("doctor").value;
            const dateVal = document.getElementById("date").value;
            const timeVal = document.getElementById("time").value;

            // FIXED: Check if the manual name input is used, otherwise use the account name
            const manualName = document.getElementById("pname").value;
            const patientName = manualName || currentUser.name;

            if (!dateVal || !timeVal || !patientName) {
                document.getElementById("msg").innerHTML = "<span class='text-danger'>Please fill in all fields</span>";
                return;
            }
            window.chrome.webview.postMessage("save_booking");
            document.getElementById("msg").innerHTML = "<span class='text-success'>Processing with System...</span>";
            document.getElementById("msg").innerHTML = "<span class='text-success'>Booked Successfully!</span>";

            // Clear fields
            document.getElementById("pname").value = "";
            document.getElementById("date").value = "";
            document.getElementById("time").value = "";
        }
        function loadAppointments() {
            const bookings = JSON.parse(localStorage.getItem("bookings")) || [];
            let table = "";
            const filtered = (currentUser.role === 'doctor') ? bookings : bookings.filter(b => b.bookedBy === currentUser.name);

            filtered.forEach(b => {
                table += `<tr><td>${b.patient}</td><td class="text-primary">${b.doctor}</td><td>${b.date}</td><td>${b.time}</td>
                              <td><button onclick="cancelAppt(${b.id})" class="btn btn-sm btn-outline-danger">Cancel</button></td></tr>`;
            });
            document.getElementById("data").innerHTML = table || "<tr><td colspan='5' class='text-center'>No records found.</td></tr>";
        }

        function cancelAppt(id) {
            let bookings = JSON.parse(localStorage.getItem("bookings")) || [];
            localStorage.setItem("bookings", JSON.stringify(bookings.filter(b => b.id !== id)));
            let cancelled = parseInt(localStorage.getItem("cancelledCount")) || 0;
            localStorage.setItem("cancelledCount", cancelled + 1);
            loadAppointments();
        }

        function calculateStats() {
            const bookings = JSON.parse(localStorage.getItem("bookings")) || [];
            const cancelled = parseInt(localStorage.getItem("cancelledCount")) || 0;
            document.getElementById("totalCount").innerText = bookings.length + cancelled;
            document.getElementById("pendingCount").innerText = bookings.length;
            document.getElementById("cancelledCount").innerText = cancelled;
        }

        function showBooking() { hideAll(); document.getElementById("bookingPage").classList.remove("hidden"); document.getElementById("msg").innerText = ""; }
        function showAppointments() { hideAll(); document.getElementById("appointmentsPage").classList.remove("hidden"); loadAppointments(); }
        function showStats() { hideAll(); document.getElementById("statsPage").classList.remove("hidden"); calculateStats(); }

        function backDashboard() {
            hideAll();
            if (currentUser.role === 'doctor') document.getElementById("doctorDashboard").classList.remove("hidden");
            else document.getElementById("patientDashboard").classList.remove("hidden");
        }

        function hideAll() {
            document.getElementById("loginPage").classList.add("hidden");
            document.getElementById("patientDashboard").classList.add("hidden");
            document.getElementById("doctorDashboard").classList.add("hidden");
            document.getElementById("bookingPage").classList.add("hidden");
            document.getElementById("appointmentsPage").classList.add("hidden");
            document.getElementById("statsPage").classList.add("hidden");
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
