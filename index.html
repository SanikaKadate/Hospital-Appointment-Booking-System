<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthSync Pro - Dual Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <style>
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1516549655169-df83a0774514?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.98);
            border: none;
        }

        .stat-card {
            border-radius: 15px;
            padding: 15px;
            color: white;
            text-align: center;
            flex: 1;
            min-width: 120px;
        }

        .login-header-img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 3px solid #0d6efd;
            background: white;
            padding: 10px;
        }

        .hidden {
            display: none !important;
        }

        .navbar {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
        }

        .btn {
            transition: 0.3s;
            font-weight: 600;
            border-radius: 10px;
        }

            .btn:hover {
                transform: scale(1.05);
            }

        .badge-pending {
            background-color: #ffc107;
            color: #000;
        }

        .badge-completed {
            background-color: #198754;
        }

        .badge-cancelled {
            background-color: #dc3545;
        }

        label {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark px-3 sticky-top">
        <span class="navbar-brand fw-bold">🏥 HealthSync Pro</span>
    </nav>

    <div id="loginPage" class="container mt-5 animate__animated animate__fadeIn">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow p-4 text-center">
                    <img src="https://cdn-icons-png.flaticon.com/512/3063/3063176.png" class="login-header-img mx-auto">
                    <h3 id="authTitle" class="text-primary mb-3 fw-bold">System Login</h3>

                    <div class="text-start">
                        <div id="signUpFields" class="hidden">
                            <label class="small text-muted">Full Name</label>
                            <input id="regName" class="form-control mb-2" placeholder="Enter your name">
                        </div>
                        <label class="small text-muted">Email</label>
                        <input id="email" class="form-control mb-2" placeholder="Email">
                        <label class="small text-muted">Password</label>
                        <input id="password" type="password" class="form-control mb-3" placeholder="Password">
                    </div>

                    <div id="loginActions">
                        <button onclick="login()" class="btn btn-primary w-100 py-2 mb-3">Login</button>
                        <p class="small">New Patient? <a href="javascript:void(0)" onclick="toggleAuth(true)">Sign Up here</a></p>
                    </div>

                    <div id="signUpActions" class="hidden">
                        <button onclick="register()" class="btn btn-success w-100 py-2 mb-3">Create Account</button>
                        <p class="small">Already have an account? <a href="javascript:void(0)" onclick="toggleAuth(false)">Login</a></p>
                    </div>

                    <p id="error" class="text-danger text-center mt-3 small"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="patientDashboard" class="container text-center mt-5 hidden">
        <h1 class="text-white fw-bold mb-2">Patient Portal 👋</h1>
        <div class="d-flex justify-content-center flex-wrap gap-3 mt-4">
            <button onclick="showPage('bookingPage')" class="btn btn-success px-4 py-3">📅 New Appointment</button>
            <button onclick="loadAppointmentsPage(false)" class="btn btn-info px-4 py-3 text-white">📋 My Appointments</button>
            <button onclick="logout()" class="btn btn-danger px-4 py-3">Logout</button>
        </div>
    </div>

    <div id="doctorDashboard" class="container text-center mt-5 hidden">
        <h1 class="text-white fw-bold mb-2">Doctor Panel 👨‍⚕️</h1>
        <div class="d-flex justify-content-center flex-wrap gap-3 mt-4">
            <button onclick="loadAppointmentsPage(true)" class="btn btn-warning px-4 py-3">📊 Analytics & Summary</button>
            <button onclick="loadSchedulePage()" class="btn btn-primary px-4 py-3">🗓️ Patient Schedule</button>
            <button onclick="logout()" class="btn btn-danger px-4 py-3">Logout</button>
        </div>
    </div>

    <div id="bookingPage" class="container mt-5 hidden">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow animate__animated animate__zoomIn">
                    <h3 class="text-center text-primary mb-4 fw-bold">Schedule Visit</h3>
                    <label>Patient Name</label>
                    <input type="text" id="pname" class="form-control mb-3" placeholder="Enter Full Name">

                    <label>Specialist</label>
                    <select id="doctorSelect" class="form-control mb-3">
                        <option>Dr. Sharma (Cardiology)</option>
                        <option>Dr. Patel (Neurology)</option>
                    </select>

                    <label>Preferred Date</label>
                    <input type="date" id="date" class="form-control mb-3">

                    <label>Preferred Time</label>
                    <input type="time" id="time" class="form-control mb-3">

                    <button onclick="book()" class="btn btn-primary w-100">Confirm Booking</button>
                    <p id="msg" class="text-center mt-3"></p>
                    <button onclick="returnToDashboard()" class="btn btn-secondary w-100 mt-2">Back</button>
                </div>
            </div>
        </div>
    </div>

    <div id="viewPage" class="container mt-5 hidden">
        <div class="card p-4 shadow animate__animated animate__fadeIn">
            <h3 id="viewTitle" class="text-center text-primary mb-4 fw-bold">Appointment Records</h3>

            <div id="statsBar" class="d-flex flex-wrap gap-2 mb-4 hidden">
                <div class="stat-card bg-primary"><h6>Total</h6><h4 id="statTotal">0</h4></div>
                <div class="stat-card bg-warning"><h6>Pending</h6><h4 id="statPending">0</h4></div>
                <div class="stat-card bg-success"><h6>Done</h6><h4 id="statCompleted">0</h4></div>
                <div class="stat-card bg-danger"><h6>Cancelled</h6><h4 id="statCancelled">0</h4></div>
            </div>

            <div class="table-responsive" id="tableContainer">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Patient Name</th>
                            <th>Specialist</th>
                            <th>Date & Time</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentData"></tbody>
                </table>
            </div>
            <button onclick="returnToDashboard()" class="btn btn-secondary mt-3">Back to Dashboard</button>
        </div>
    </div>

    <script>
        let currentUser = null;

        // Toggle between Login and Sign Up
        function toggleAuth(isSignUp) {
            document.getElementById("authTitle").innerText = isSignUp ? "Create Account" : "System Login";
            document.getElementById("signUpFields").classList.toggle("hidden", !isSignUp);
            document.getElementById("signUpActions").classList.toggle("hidden", !isSignUp);
            document.getElementById("loginActions").classList.toggle("hidden", isSignUp);
            document.getElementById("error").innerText = "";
        }

        // User Registration
        function register() {
            let name = document.getElementById("regName").value;
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value;

            if (!name || !email || !pass) {
                document.getElementById("error").innerText = "Please fill all fields!";
                return;
            }

            let users = JSON.parse(localStorage.getItem("hs_users")) || [];
            if (users.find(u => u.email === email)) {
                document.getElementById("error").innerText = "Email already registered!";
                return;
            }

            users.push({ name, email, pass, role: 'patient' });
            localStorage.setItem("hs_users", JSON.stringify(users));

            alert("Account created! You can now login.");
            toggleAuth(false);
        }

        // Login Logic
        function login() {
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value;

            // Hardcoded Doctor Access
            if (email === "doctor@sync.com" && pass === "HealthSync1234") {
                currentUser = 'doctor';
                enterDashboard();
                return;
            }

            // Check Registered Patients
            let users = JSON.parse(localStorage.getItem("hs_users")) || [];
            let user = users.find(u => u.email === email && u.pass === pass);

            if (user) {
                currentUser = 'patient';
                // Auto-fill booking name for convenience
                document.getElementById("pname").value = user.name;
                enterDashboard();
            } else {
                document.getElementById("error").innerText = "Invalid credentials!";
            }
        }

        function enterDashboard() {
            document.getElementById("loginPage").classList.add("hidden");
            document.getElementById(currentUser + "Dashboard").classList.remove("hidden");
        }

        function showPage(pageId) {
            document.querySelectorAll('.container').forEach(c => c.classList.add('hidden'));
            document.getElementById(pageId).classList.remove('hidden');
        }

        function returnToDashboard() {
            showPage(currentUser + "Dashboard");
        }

        function book() {
            let name = document.getElementById("pname").value;
            let doc = document.getElementById("doctorSelect").value;
            let date = document.getElementById("date").value;
            let time = document.getElementById("time").value;

            if (!name || !date || !time) return document.getElementById("msg").innerHTML = "❌ Missing info";

            let bookings = JSON.parse(localStorage.getItem("all_bookings")) || [];
            bookings.push({
                id: Date.now(),
                patient: name,
                doctor: doc,
                date: date,
                time: time,
                status: 'Pending'
            });

            localStorage.setItem("all_bookings", JSON.stringify(bookings));
            document.getElementById("msg").innerHTML = "<span class='text-success fw-bold'>✅ Booked Successfully!</span>";
        }

        function loadAppointmentsPage(isDoctor) {
            showPage('viewPage');
            document.getElementById("viewTitle").innerText = isDoctor ? "Practice Analytics" : "My Appointment History";
            renderTable(isDoctor ? 'summary' : 'all');
        }

        function loadSchedulePage() {
            showPage('viewPage');
            document.getElementById("viewTitle").innerText = "Current Patient Schedule";
            renderTable('pending');
        }

        function renderTable(filterMode) {
            let bookings = JSON.parse(localStorage.getItem("all_bookings")) || [];
            let html = "";
            const statsBar = document.getElementById("statsBar");
            const tableContainer = document.getElementById("tableContainer");

            let stats = { total: bookings.length, pending: 0, completed: 0, cancelled: 0 };
            bookings.forEach(b => stats[b.status.toLowerCase()]++);

            document.getElementById("statTotal").innerText = stats.total;
            document.getElementById("statPending").innerText = stats.pending;
            document.getElementById("statCompleted").innerText = stats.completed;
            document.getElementById("statCancelled").innerText = stats.cancelled;

            if (filterMode === 'summary') {
                statsBar.classList.remove("hidden");
                tableContainer.classList.add("hidden");
                return;
            } else {
                statsBar.classList.add("hidden");
                tableContainer.classList.remove("hidden");
            }

            bookings.forEach(b => {
                if (filterMode === 'pending' && b.status !== 'Pending') return;

                let statusBadge = `<span class="badge badge-${b.status.toLowerCase()}">${b.status}</span>`;
                let actions = "";

                if (currentUser === 'doctor' && b.status === 'Pending') {
                    actions = `
                    <button class="btn btn-sm btn-success" onclick="updateStatus(${b.id}, 'Completed', 'pending')">Done</button>
                    <button class="btn btn-sm btn-danger" onclick="updateStatus(${b.id}, 'Cancelled', 'pending')">Cancel</button>
                `;
                } else if (currentUser === 'doctor') {
                    actions = `<small class="text-muted">Finalized</small>`;
                } else {
                    actions = b.status === 'Pending' ? `<small class="text-muted">Awaiting</small>` : "-";
                }

                html += `<tr>
                <td><strong>${b.patient || 'N/A'}</strong></td>
                <td>${b.doctor}</td>
                <td>${b.date} | ${b.time}</td>
                <td>${statusBadge}</td>
                <td>${actions}</td>
            </tr>`;
            });

            document.getElementById("appointmentData").innerHTML = html || "<tr><td colspan='5' class='text-center py-4'>No records found.</td></tr>";
        }

        function updateStatus(id, newStatus, currentFilter) {
            let bookings = JSON.parse(localStorage.getItem("all_bookings")) || [];
            let index = bookings.findIndex(b => b.id === id);
            if (index !== -1) {
                bookings[index].status = newStatus;
                localStorage.setItem("all_bookings", JSON.stringify(bookings));
                renderTable(currentFilter);
            }
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
